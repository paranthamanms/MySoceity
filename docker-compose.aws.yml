services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nammasociety-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.aws.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist/login:/usr/share/nginx/html/login:ro
      - ./frontend-dist/register:/usr/share/nginx/html/register:ro
      - ./frontend-dist/dashboard:/usr/share/nginx/html/dashboard:ro
      # Uncomment these only after you place real cert files in ./ssl
      # - ./ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - ./ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - user-service
      - auth-service
    restart: always

  user-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: nammasociety-user
    volumes:
      - ./user-service-1.0.0.jar:/app.jar:ro
    command: ["java", "-jar", "/app.jar"]
    environment:
      SERVER_PORT: "8001"
      SERVER_ADDRESS: "0.0.0.0"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://nammasociety-db.c1askoagarr9.ap-south-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "Ad1tya2312"
    expose:
      - "8001"
    restart: always

  auth-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: nammasociety-auth
    volumes:
      - ./auth-service-1.0.0.jar:/app.jar:ro
    command: ["java", "-jar", "/app.jar"]
    environment:
      SERVER_PORT: "8002"
      SERVER_ADDRESS: "0.0.0.0"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://nammasociety-db.c1askoagarr9.ap-south-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "Ad1tya2312"
    expose:
      - "8002"
    restart: always
