server {
    listen 80 default_server;
    server_name _;

    # Health check for ALB target group
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Frontend default landing
    location = / {
        return 302 /login-mfe/;
    }

    # Login MFE
    location /login-mfe/ {
        alias /usr/share/nginx/html/login/;
        try_files $uri $uri/ /login-mfe/index.html;
    }

    # Register MFE
    location /register-mfe/ {
        alias /usr/share/nginx/html/register/;
        try_files $uri $uri/ /register-mfe/index.html;
    }

    # Dashboard MFE
    location /dashboard-mfe/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /dashboard-mfe/index.html;
    }

    # Auth backend API
    location /api/auth/ {
        proxy_pass http://auth-service:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User backend API
    location /api/users/ {
        proxy_pass http://user-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
