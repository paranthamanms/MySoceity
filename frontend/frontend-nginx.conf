# ================================================================
# Frontend Nginx Configuration
# Serves all 3 Angular micro-frontends
# ================================================================

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health endpoint for ALB target group checks
    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Root entry redirects to login MFE
    location = / {
        return 302 /login-mfe/;
    }

    # Login MFE
    location /login-mfe/ {
        alias /usr/share/nginx/html/login/;
        try_files $uri $uri/ /login-mfe/index.html;
    }

    # Register MFE
    location /register-mfe/ {
        alias /usr/share/nginx/html/register/;
        try_files $uri $uri/ /register-mfe/index.html;
    }

    # Dashboard MFE
    location /dashboard-mfe/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /dashboard-mfe/index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
